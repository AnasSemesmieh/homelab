# Infrastructure
- Infrastructure:
    - Synology NAS (DS416play):
        icon: synology.png
        href: https://nas.homelab.internal
        description: Storage and Docker host
        widget:
            type: diskstation
            url: https://192.168.20.2:8443
            username: REDACTED
            password: REDACTED
            volume: volume_2 # optional to switch to a specific volume, otherwise will show volume 1
    
    - Info:
        icon: glances.png
        href: https://glances.homelab.internal
        server: host
        widget:
            type: glances
            url: http://192.168.20.69:61208
            version: 4
            metric: info
            chart: true

    - CPU:
        icon: glances.png
        href: https://glances.homelab.internal
        server: host
        widget:
            type: glances
            url: http://192.168.20.69:61208
            version: 4
            metric: cpu

    
    - Portainer:
        icon: portainer.png
        href: https://portainer.homelab.internal
