# Network
- Network:
    
    - Traefik:
        icon: mdi-transit-connection-variant
        href: https://traefik.homelab.internal
        description: Reverse proxy and dashboard
        server: my-docker
        container: traefik
        widget:
            type: traefik
            url: http://192.168.20.69:8888

    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.homelab.internal/admin
        description: Network-wide adblocker
        server: my-docker
        container: pihole
        widget:
            type: pihole
            url: http://192.168.20.69:8001
            version: 6 # required if running v6 or higher, defaults to 5
            key: REDACTED
    
    
    - CF tunnel:
        icon: cloudflare.png
        href: https://dash.cloudflare.com/
        description: Cloudflare Tunnel Dashboard
        server: my-docker
        container: cloudflared
        widget:
            type: cloudflared
            accountid: 63c4a39ab833c667db5a4bd4539da518 # from zero trust dashboard url e.g. https://one.dash.cloudflare.com/<accountid>/home/quick-start
            tunnelid: f296b912-2a86-4691-bc6e-5e6c4f7c8a4e # found in tunnels dashboard under the tunnel name
            key: REDACTED

    - TailScale (homelab):
        icon: tailscale.png
        href: https://nas.homelab.internal/webman/3rdparty/Tailscale/index.cgi/
        server: my-docker
        container: tailscale
        widgets:
            -   type: tailscale
                description: homelab
                deviceid: nFU5FTpkW411CNTRL #homelab
                key: REDACTED
            -   type: tailscale
                description: NAS
                deviceid: nqu7nokmzw11CNTRL #NAS
                key: REDACTED
            -   type: tailscale
                description: iPhone
                deviceid: nKZpBpEyTw11CNTRL #iPhone
                key: REDACTED
            -   type: tailscale
                description: MSI Laptop
                deviceid: ndFCtzuZLt11CNTRL #MSI
                key: REDACTED


