http:
  routers:
    portainer-http:
      rule: "Host(`portainer.homelab.internal`)"
      entryPoints:
        - web
      middlewares:
        - portainer-redirect-https
      service: portainer-service

    portainer-https:
      rule: "Host(`portainer.homelab.internal`)"
      entryPoints:
        - websecure
      middlewares:
        - authentik@file
      tls: {}
      service: portainer-service

    code-http:
      rule: "Host(`code.homelab.internal`)"
      entryPoints:
        - web
      middlewares:
        - code-redirect-https
      service: code-service

    code-https:
      rule: "Host(`code.homelab.internal`)"
      entryPoints:
        - websecure
      middlewares:
        - authentik@file
      tls: {}
      service: code-service

    scrypted-http:
      rule: "Host(`scrypted.homelab.internal`)"
      entryPoints:
        - web
      middlewares:
        - scrypted-redirect-https
      service: scrypted-service

    scrypted-https:
      rule: "Host(`scrypted.homelab.internal`)"
      entryPoints:
        - websecure
      tls: {}
      service: scrypted-service

    tautulli-http:
      rule: "Host(`tautulli.homelab.internal`)"
      entryPoints:
        - web
      middlewares:
        - tautulli-redirect-https
      service: tautulli-service

    tautulli-https:
