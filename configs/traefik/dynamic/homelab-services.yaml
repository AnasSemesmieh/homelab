      entryPoints:
        - web
      middlewares:
        - homeassistant-redirect-https
      service: homeassistant-service

    homeassistant-https:
      rule: "Host(`homeassistant.homelab.internal`)"
      entryPoints:
        - websecure
      tls: {}
      service: homeassistant-service

    myspeed-http:
