services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8001:80"
      - "8444:443/tcp"
    environment:
      TZ: 'Australia/Sydney'
      WEBPASSWORD: REDACTED
      DNS1: 1.1.1.1
      DNS2: 8.8.8.8
    volumes:
      - ./etc-pihole/:/etc/pihole/
      - ./etc-dnsmasq.d/:/etc/dnsmasq.d/
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pihole-http.rule=Host(`pihole.homelab.internal`)
      - traefik.http.routers.pihole-http.entrypoints=web
      - traefik.http.routers.pihole-http.middlewares=pihole-https-redirect
      - traefik.http.middlewares.pihole-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.pihole-http.service=pihole
      - traefik.http.routers.pihole-https.rule=Host(`pihole.homelab.internal`)
      - traefik.http.routers.pihole-https.entrypoints=websecure
      - traefik.http.routers.pihole-https.tls=true
      - traefik.http.routers.pihole-https.middlewares=authentik@file
      - traefik.http.routers.pihole-https.service=pihole
      - traefik.http.services.pihole.loadbalancer.server.port=80
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    external: true
