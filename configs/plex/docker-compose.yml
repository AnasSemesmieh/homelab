services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - /mnt/media:/data/media
      - /mnt/movies:/data/movies
      - /mnt/series:/data/series
